<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Calculadora Web{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='script.js') }}" defer></script>
</head>
<body>
    <nav class="menu" aria-label="Menu principal">
        <a href="{{ url_for('inicio') }}">Início</a>
        <a href="{{ url_for('pagina_operacao', operacao='soma') }}">Soma</a>
        <a href="{{ url_for('pagina_operacao', operacao='subtracao') }}">Subtração</a>
        <a href="{{ url_for('pagina_operacao', operacao='multiplicacao') }}">Multiplicação</a>
        <a href="{{ url_for('pagina_operacao', operacao='divisao') }}">Divisão</a>
    </nav>
    <main class="cartao">{% block content %}{% endblock %}</main>
</body>
</html>
