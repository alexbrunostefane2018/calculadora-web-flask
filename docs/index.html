<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculadora Web | Alex Bruno</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui,Arial,sans-serif;background:#edf2f9;color:#152849;margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(100%,460px);background:white;border-radius:20px;padding:32px;box-shadow:0 18px 48px #15284918}h1{margin:0 0 8px}p{color:#54647c}label{display:block;font-weight:600;margin:20px 0 7px}input,select{width:100%;font:inherit;border:1px solid #aab8ce;border-radius:9px;padding:13px;background:white}button{background:#235ac6;color:white;border:0;border-radius:9px;padding:14px;width:100%;font:inherit;font-weight:700;margin-top:24px;cursor:pointer}button:hover{background:#1749ad}#resultado{font-size:1.25rem;font-weight:700;color:#1749ad;min-height:32px}small{color:#67758b}
</style></head><body><main class="card"><h1>Calculadora Web</h1><p>Soma, subtração, multiplicação e divisão.</p><form id="form"><label for="operacao">Operação</label><select id="operacao"><option value="soma">Soma (+)</option><option value="subtracao">Subtração (−)</option><option value="multiplicacao">Multiplicação (×)</option><option value="divisao">Divisão (÷)</option></select><label for="numero1">Primeiro número</label><input type="number" step="any" id="numero1" required><label for="numero2">Segundo número</label><input type="number" step="any" id="numero2" required><button type="submit">Calcular</button></form><p id="resultado" role="status" aria-live="polite"></p><small>Alex Bruno Braz da Silva</small></main>
<script>
document.getElementById('form').addEventListener('submit',function(e){e.preventDefault();const a=Number(document.getElementById('numero1').value),b=Number(document.getElementById('numero2').value),op=document.getElementById('operacao').value,el=document.getElementById('resultado');if(!Number.isFinite(a)||!Number.isFinite(b)){el.textContent='Informe números válidos.';return}if(op==='divisao'&&b===0){el.textContent='Não é possível dividir por zero.';return}const v=op==='soma'?a+b:op==='subtracao'?a-b:op==='multiplicacao'?a*b:a/b;el.textContent=Number.isFinite(v)?'Resultado: '+new Intl.NumberFormat('pt-BR',{maximumFractionDigits:12}).format(v):'Resultado fora do intervalo permitido.'});
</script></body></html>
